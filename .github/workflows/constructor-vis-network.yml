name: Preparar biblioteca grafica del constructor publico
on:
  push:
    branches: [main]
    paths:
      - "herramientas/constructor-chatbots/**"
      - "!herramientas/constructor-chatbots/vendor/vis-network.min.js"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Descargar y verificar vis-network 9.1.9
        shell: bash
        run: |
          set -euo pipefail
          target="herramientas/constructor-chatbots/vendor/vis-network.min.js"
          url="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/standalone/umd/vis-network.min.js"
          mkdir -p "$(dirname "$target")"
          curl --fail --location --silent --show-error --retry 3 --max-time 120 "$url" --output "$target"
          printf '%s  %s\n' 'f53f833ddb9bf97efe856bb0637d4fe88f39e39999c7e94a4b8afc8de8a1a2e5' "$target" | sha256sum --check
      - name: Conservar biblioteca para GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add herramientas/constructor-chatbots/vendor/vis-network.min.js
          if ! git diff --cached --quiet; then
            git commit -m "build: empaquetar biblioteca visual verificada para sitio publico"
            git push origin HEAD:main
          fi

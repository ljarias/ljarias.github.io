name: Publicar IA al Día

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "30 6 * * *"
      timezone: "America/Bogota"
  workflow_dispatch:
    inputs:
      regenerar_infografia:
        description: "Regenerar la infografía de hoy aunque ya exista"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar ejecución diaria
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          TODAY=$(TZ=America/Bogota date +'%Y-%m-%d')
          EVENT="${{ github.event_name }}"
          SUMMARY_NEEDED=false
          INFO_NEEDED=false

          if [[ "$EVENT" == "schedule" || "$EVENT" == "workflow_dispatch" ]]; then
            SUMMARY_NEEDED=true
            INFO_NEEDED=true
          elif [[ "$EVENT" == "push" && -f "_posts/${TODAY}-ia-al-dia.md" && ! -f "assets/infografias/${TODAY}.svg" ]]; then
            # Si ya existe la noticia del día pero falta su pieza visual,
            # la genera sin necesidad de consumir una API de imágenes.
            INFO_NEEDED=true
          fi

          echo "SUMMARY_NEEDED=$SUMMARY_NEEDED" >> "$GITHUB_ENV"
          echo "INFO_NEEDED=$INFO_NEEDED" >> "$GITHUB_ENV"

          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "::warning::Falta OPENAI_API_KEY. No se podrá generar un nuevo resumen, pero sí las infografías de ediciones existentes."
            echo "AI_ENABLED=false" >> "$GITHUB_ENV"
          else
            echo "AI_ENABLED=true" >> "$GITHUB_ENV"
          fi

      - name: Configurar Python
        if: env.INFO_NEEDED == 'true' || (env.SUMMARY_NEEDED == 'true' && env.AI_ENABLED == 'true')
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias del agente de noticias
        if: env.SUMMARY_NEEDED == 'true' && env.AI_ENABLED == 'true'
        run: pip install -r requirements.txt

      - name: Generar resumen diario
        id: generar
        continue-on-error: true
        if: env.SUMMARY_NEEDED == 'true' && env.AI_ENABLED == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
        run: python scripts/generar_resumen.py

      - name: Avisar si falló el resumen
        if: steps.generar.outcome == 'failure'
        run: |
          echo "::warning::El agente no pudo generar la edición de hoy. El sitio se publicará con el contenido existente."

      - name: Generar infografía diaria
        id: infografia
        continue-on-error: true
        if: env.INFO_NEEDED == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.generar.outcome == 'success')
        env:
          FORCE_INFOGRAFIA: ${{ inputs.regenerar_infografia }}
        run: python scripts/generar_infografia.py

      - name: Avisar si falló la infografía
        if: steps.infografia.outcome == 'failure'
        run: |
          echo "::warning::No se pudo crear la infografía de hoy. La edición textual seguirá publicándose normalmente."

      - name: Guardar edición e infografía en GitHub
        if: env.INFO_NEEDED == 'true' || (env.SUMMARY_NEEDED == 'true' && env.AI_ENABLED == 'true')
        run: |
          if [[ -n "$(git status --porcelain _posts data _data assets/infografias 2>/dev/null)" ]]; then
            git config user.name "ia-al-dia-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _posts data _data assets/infografias 2>/dev/null || true
            git commit -m "Publicar IA al Día $(TZ=America/Bogota date +'%Y-%m-%d')"
            git push
          else
            echo "No hay cambios editoriales ni visuales para guardar."
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Construir sitio Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Preparar artefacto de Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

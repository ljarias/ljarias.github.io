---
layout: default
---
<article class="post container narrow">
  <header class="post-header">
    <div class="eyebrow">Resumen diario</div>
    <h1>{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: "%d/%m/%Y" }} · {{ page.reading_time | default: "Lectura breve" }}</p>
    {% if page.summary %}<p class="lead">{{ page.summary }}</p>{% endif %}
  </header>
  <div class="post-content">
    {{ content }}
  </div>
  <div class="post-back"><a href="{{ '/' | relative_url }}">← Volver al archivo</a></div>
</article>

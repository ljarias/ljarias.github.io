<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asistente de decisiones</title><style>
:root{font-family:system-ui,Segoe UI,sans-serif;color:#15334b;background:#eef4f2}*{box-sizing:border-box}body{margin:0;padding:14px}.app{max-width:690px;margin:auto;background:#fff;border:1px solid #b6d0c8;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px #1232}header{background:#176145;color:white;padding:22px}h1{margin:0 0 5px;font-size:1.5rem}header p{margin:0;color:#e5f7ed}.note{padding:12px 20px;background:#fff6da;line-height:1.5}.content{padding:18px}.bubble{background:#edf4f9;padding:15px;border-radius:12px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:grid;grid-template-columns:1fr;gap:10px;margin:18px 0}button,a.cta{display:block;cursor:pointer;border:2px solid #176145;border-radius:12px;padding:13px;background:white;color:#135039;font:inherit;font-weight:700;text-align:left;text-decoration:none}button:hover,button:focus-visible,a.cta:hover,a.cta:focus-visible{outline:3px solid #ffca42;outline-offset:2px}a.cta{background:#176145;color:#fff;text-align:center}.secondary{border-color:#82908b!important;color:#314c46!important;background:#f6faf8!important}.trail{border-top:1px solid #ddd;padding:12px 18px;color:#4f5d63;font-size:.84rem}footer{padding:12px 18px;border-top:1px solid #eee;color:#64726c;font-size:.77rem} @media(min-width:500px){.actions{grid-template-columns:1fr 1fr}} </style></head><body><main class="app"><header><h1 id="title"></h1><p id="subtitle"></p></header><div class="note">⚠️ Guía educativa: ante un peligro real, busca ayuda humana inmediata. El chatbot no llama automáticamente ni realiza reportes oficiales.</div><section class="content"><div class="bubble" id="message" aria-live="polite"></div><div class="actions" id="actions"></div></section><div class="trail" id="trail"></div><footer>Opera sin internet, salvo los enlaces a WhatsApp, que necesitan conexión y la aplicación o web de WhatsApp.</footer></main>
<script>"use strict";
const PROJECT={"version":2,"name":"SST Orienta · Árbol de decisiones","description":"Decide qué hacer ante una situación laboral simulada","start":"q1","routes":[{"id":"r_emergencia","title":"Pedir ayuda urgente","message":"Aléjate del peligro si es seguro hacerlo. Solicita ayuda humana y activa el plan de emergencias. Si corresponde, llama al 123 en Colombia. No esperes al chatbot.","phone":""},{"id":"r_incidente","title":"Informar un casi accidente","message":"No hubo lesión. Informa cuanto antes a tu supervisor o responsable SST y evita exponerte al peligro. La empresa debe registrar e investigar el incidente.","phone":""},{"id":"r_accidente","title":"Solicitar atención por accidente","message":"Prioriza la atención médica y avisa a tu jefe o responsable SST. La empresa debe gestionar los reportes e investigación según el procedimiento vigente.","phone":""},{"id":"r_duda","title":"No estoy seguro / necesito orientación","message":"Evita exponerte al peligro. Avisa al supervisor o responsable de SST para que revisen lo sucedido. Si hay síntomas, busca valoración profesional; si hay emergencia, solicita ayuda inmediata.","phone":""}],"nodes":[{"id":"q1","type":"question","text":"¿Existe un peligro inmediato o alguien necesita ayuda urgente?","options":[{"label":"Sí, hay urgencia","to":"n_emergencia"},{"label":"No, podemos revisar","to":"q2"},{"label":"No puedo determinarlo","to":"n_duda"}]},{"id":"q2","type":"question","text":"¿Una persona sufrió una lesión?","options":[{"label":"Sí","to":"n_accidente"},{"label":"No","to":"n_incidente"},{"label":"No estoy seguro","to":"n_duda"}]},{"id":"n_emergencia","type":"end","routeId":"r_emergencia"},{"id":"n_incidente","type":"end","routeId":"r_incidente"},{"id":"n_accidente","type":"end","routeId":"r_accidente"},{"id":"n_duda","type":"end","routeId":"r_duda"}]};
const $=id=>document.getElementById(id);let history=[];const nodes=Object.assign(Object.create(null),Object.fromEntries(PROJECT.nodes.map(x=>[x.id,x])));const routes=Object.assign(Object.create(null),Object.fromEntries(PROJECT.routes.map(x=>[x.id,x])));
$('title').textContent=PROJECT.name;$('subtitle').textContent=PROJECT.description||'Árbol de decisiones';
function btn(text,fn,cls=''){let b=document.createElement('button');b.type='button';b.textContent=text;b.className=cls;b.addEventListener('click',fn);$('actions').append(b)}
function go(id){const n=nodes[id];$('actions').replaceChildren();if(!n){$('message').textContent='Ruta incompleta. Regresa al inicio y consulta al docente.';btn('Volver al inicio',reset,'secondary');return}history.push(id);$('trail').textContent='Pasos recorridos: '+history.length;if(n.type==='question'){$('message').textContent=n.text;for(const o of n.options){btn(o.label,()=>go(o.to))}}else{const r=routes[n.routeId];$('message').textContent=r?r.title+'\n\n'+r.message:'Ruta final no encontrada.';if(/^57[0-9]{10}$/.test(r?.phone||'')){const link=document.createElement('a');link.className='cta';link.href='https://wa.me/'+r.phone+'?text='+encodeURIComponent('Hola, necesito orientación sobre: '+r.title);link.textContent='💬 Abrir WhatsApp del responsable';link.target='_blank';link.rel='noopener noreferrer';$('actions').append(link)}btn('↩ Empezar de nuevo',reset,'secondary');} }
function reset(){history=[];go(PROJECT.start)}reset();
</script></body></html>

<title id="title">Puntuación media de diseño instruccional durante ocho semanas</title>
<desc id="desc">La puntuación media aumentó durante el experimento, pero el estudio no demuestra que la IA fuera superior a la colaboración docente y la muestra procedía de una sola institución.</desc>

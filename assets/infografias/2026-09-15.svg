<text x="672" y="492" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;font-weight:500;fill:#24364B"><tspan x="672" dy="0">La agencia estatal de seguridad de internet de</tspan><tspan x="672" dy="22">Corea del Sur anunció que está desarrollando</tspan><tspan x="672" dy="22">nuevas guías de seguridad para agentes de</tspan><tspan x="672" dy="22">inteligencia artificial capaces de actuar de</tspan><tspan x="672" dy="22">forma autónoma. Este tipo de sistemas no solo…</tspan></text>

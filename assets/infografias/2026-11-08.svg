<text x="668" y="958" style="font-family:Arial,Helvetica,sans-serif;font-size:18.5px;font-weight:600;fill:#731A37"><tspan x="668" dy="0">Reino Unido advierte que los</tspan><tspan x="668" dy="25">ataques contra infraestructuras</tspan><tspan x="668" dy="25">críticas se intensificarán</tspan></text>
<text x="668" y="1060" style="font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:400;fill:#24364B"><tspan x="668" dy="0">El responsable británico de ciberseguridad</tspan><tspan x="668" dy="20">advirtió que el Reino Unido probablemente</tspan><tspan x="668" dy="20">enfrentará ataques contra infraestructuras</tspan><tspan x="668" dy="20">críticas facilitados por inteligencia artificial</tspan></text>
<text x="668" y="1150" style="font-family:Arial,Helvetica,sans-serif;font-size:11.2px;font-weight:600;fill:#52667A"><tspan x="668" dy="0">CIBERSEGURIDAD Y SEGURIDAD</tspan><tspan x="668" dy="15">NACIONAL</tspan></text>

<text x="143" y="958" style="font-family:Arial,Helvetica,sans-serif;font-size:18.5px;font-weight:600;fill:#075E47"><tspan x="143" dy="0">Japón anuncia un paquete urgente de</tspan><tspan x="143" dy="25">ciberseguridad tras una ola de</tspan><tspan x="143" dy="25">ataques</tspan></text>
<text x="143" y="1060" style="font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:400;fill:#24364B"><tspan x="143" dy="0">Japón anunció un paquete de emergencia de</tspan><tspan x="143" dy="20">ciberseguridad después de una serie de</tspan><tspan x="143" dy="20">filtraciones y ataques contra grandes empresas y</tspan><tspan x="143" dy="20">organismos públicos.</tspan></text>
<text x="143" y="1150" style="font-family:Arial,Helvetica,sans-serif;font-size:11.2px;font-weight:600;fill:#52667A"><tspan x="143" dy="0">CIBERSEGURIDAD Y POLÍTICA</tspan><tspan x="143" dy="15">PÚBLICA</tspan></text>
<rect x="410" y="1137" width="100" height="34" rx="17" fill="#DC2626"/>
<text x="460" y="1160" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#FFFFFF">ALTO</text>

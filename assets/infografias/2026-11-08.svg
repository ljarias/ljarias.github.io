<text x="100" y="1304" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;font-weight:500;fill:#153A5B"><tspan x="100" dy="0">¿Qué diferencia existe entre una predicción oficial sobre un riesgo y un</tspan><tspan x="100" dy="22">hecho ya observado?</tspan></text>
<circle cx="66" cy="1358" r="20" fill="#1F75C9"/>
<text x="66" y="1365" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#FFFFFF">2</text>
<text x="100" y="1359" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;font-weight:500;fill:#153A5B"><tspan x="100" dy="0">¿Cómo deberían verificar las empresas una orden recibida por voz o</tspan><tspan x="100" dy="22">videollamada?</tspan></text>
<circle cx="66" cy="1413" r="20" fill="#1F75C9"/>
<text x="66" y="1420" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#FFFFFF">3</text>
<text x="100" y="1414" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;font-weight:500;fill:#153A5B"><tspan x="100" dy="0">¿Puede una escuela adoptar herramientas de IA sin depender excesivamente</tspan><tspan x="100" dy="22">de una sola empresa?</tspan></text>
<rect x="25" y="1490" width="1030" height="265" rx="28" fill="#073C68"/>
<text x="55" y="1540" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">Semáforo de la semana</text>

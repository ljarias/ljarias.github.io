<circle cx="67" cy="667" r="25" fill="#E2A600"/><text x="67" y="675" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#FFFFFF">3</text>
<g transform="translate(40,708)"><path d="M50 5 L94 83 H6 Z" fill="#FFD54A" stroke="#5C4700" stroke-width="5"/><line x1="50" y1="29" x2="50" y2="58" stroke="#5C4700" stroke-width="7" stroke-linecap="round"/><circle cx="50" cy="70" r="4" fill="#5C4700"/></g>
<text x="143" y="668" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:600;fill:#5C4700"><tspan x="143" dy="0">Google condiciona el acceso</tspan><tspan x="143" dy="25">escolar a su buscador a la</tspan><tspan x="143" dy="25">adopción de IA</tspan></text>
<text x="143" y="770" style="font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:400;fill:#24364B"><tspan x="143" dy="0">Google anunció que estudiantes que utilicen sus</tspan><tspan x="143" dy="20">herramientas educativas no podrán acceder a su</tspan><tspan x="143" dy="20">buscador si el distrito escolar correspondiente</tspan><tspan x="143" dy="20">decide no adoptar también servicios de.</tspan></text>
<text x="143" y="860" style="font-family:Arial,Helvetica,sans-serif;font-size:11.2px;font-weight:600;fill:#52667A"><tspan x="143" dy="0">EDUCACIÓN Y COMPETENCIAS</tspan><tspan x="143" dy="15">DIGITALES</tspan></text>
<rect x="410" y="847" width="100" height="34" rx="17" fill="#DC2626"/>
<text x="460" y="870" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#FFFFFF">ALTO</text>
<rect x="550" y="625" width="505" height="275" rx="26" fill="#F0ECFF" stroke="#FFF1F2" stroke-width="2"/>
<circle cx="592" cy="667" r="25" fill="#6C51C7"/><text x="592" y="675" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#FFFFFF">4</text>
<g transform="translate(565,708)" fill="none" stroke="#392B73" stroke-width="5"><circle cx="50" cy="50" r="42"/><ellipse cx="50" cy="50" rx="18" ry="42"/><path d="M8 50 H92 M18 30 H82 M18 70 H82"/></g>
<text x="668" y="668" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:600;fill:#392B73"><tspan x="668" dy="0">Tres personas son acusadas de</tspan><tspan x="668" dy="25">usar IA para robar 129</tspan><tspan x="668" dy="25">millones de dólares</tspan></text>
<text x="668" y="770" style="font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:400;fill:#24364B"><tspan x="668" dy="0">Fiscales estadounidenses acusaron a tres</tspan><tspan x="668" dy="20">personas de utilizar inteligencia artificial</tspan><tspan x="668" dy="20">para hacerse pasar por directivos empresariales.</tspan></text>
<text x="668" y="860" style="font-family:Arial,Helvetica,sans-serif;font-size:11.2px;font-weight:600;fill:#52667A"><tspan x="668" dy="0">FRAUDE, DEEPFAKES Y</tspan><tspan x="668" dy="15">CIBERSEGURIDAD</tspan></text>
<rect x="935" y="847" width="100" height="34" rx="17" fill="#DC2626"/>
<text x="985" y="870" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#FFFFFF">ALTO</text>

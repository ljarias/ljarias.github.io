<circle cx="90" cy="1612" r="22" fill="#EF4444"/>
<text x="126" y="1608" font-family="Arial" font-size="17" font-weight="700" fill="#18324A">Riesgo:</text>
<text x="126" y="1633" style="font-family:Arial,Helvetica,sans-serif;font-size:13.5px;font-weight:500;fill:#273E54"><tspan x="126" dy="0">la combinación de agentes</tspan><tspan x="126" dy="17">autónomos, suplantación</tspan><tspan x="126" dy="17">audiovisual y controles</tspan><tspan x="126" dy="17">institucionales débiles</tspan><tspan x="126" dy="17">aumenta la.</tspan></text>
<rect x="380" y="1570" width="300" height="155" rx="20" fill="#FFF2C4"/>
<circle cx="422" cy="1612" r="22" fill="#F2B705"/>
<text x="458" y="1608" font-family="Arial" font-size="17" font-weight="700" fill="#18324A">Atención:</text>
<text x="458" y="1633" style="font-family:Arial,Helvetica,sans-serif;font-size:13.5px;font-weight:500;fill:#273E54"><tspan x="458" dy="0">la relación entre empresas</tspan><tspan x="458" dy="17">de IA, escuelas y</tspan><tspan x="458" dy="17">proveedores de</tspan><tspan x="458" dy="17">infraestructura digital</tspan><tspan x="458" dy="17">puede influir cada vez más</tspan></text>
<rect x="712" y="1570" width="300" height="155" rx="20" fill="#DCF7EA"/>
<circle cx="754" cy="1612" r="22" fill="#10B981"/>
<text x="790" y="1608" font-family="Arial" font-size="17" font-weight="700" fill="#18324A">Oportunidad:</text>
<text x="790" y="1633" style="font-family:Arial,Helvetica,sans-serif;font-size:13.5px;font-weight:500;fill:#273E54"><tspan x="790" dy="0">la publicación de</tspan><tspan x="790" dy="17">documentación técnica y</tspan><tspan x="790" dy="17">controles para modelos</tspan><tspan x="790" dy="17">especializados en</tspan><tspan x="790" dy="17">ciberseguridad puede</tspan></text>

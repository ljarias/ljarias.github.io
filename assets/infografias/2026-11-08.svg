<g transform="translate(40,418)" stroke="#6E1730" stroke-width="5" fill="none" stroke-linecap="round"><path d="M5 32 L48 8 L91 32 Z"/><rect x="14" y="34" width="68" height="48" rx="4"/><line x1="26" y1="40" x2="26" y2="74"/><line x1="48" y1="40" x2="48" y2="74"/><line x1="70" y1="40" x2="70" y2="74"/><line x1="7" y1="86" x2="89" y2="86"/></g>
<text x="143" y="378" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:600;fill:#6E1730"><tspan x="143" dy="0">La supervisión pública de la</tspan><tspan x="143" dy="25">IA en Estados Unidos queda</tspan><tspan x="143" dy="25">bajo presión</tspan></text>
<text x="143" y="480" style="font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:400;fill:#24364B"><tspan x="143" dy="0">La unidad estadounidense encargada de evaluar la</tspan><tspan x="143" dy="20">seguridad de nuevos sistemas de inteligencia</tspan><tspan x="143" dy="20">artificial enfrenta cuestionamientos por su</tspan><tspan x="143" dy="20">falta de liderazgo permanente.</tspan></text>
<text x="143" y="570" style="font-family:Arial,Helvetica,sans-serif;font-size:11.2px;font-weight:600;fill:#52667A"><tspan x="143" dy="0">SEGURIDAD, EVALUACIÓN Y</tspan><tspan x="143" dy="15">POLÍTICA PÚBLICA</tspan></text>
<rect x="410" y="557" width="100" height="34" rx="17" fill="#DC2626"/>
<text x="460" y="580" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#FFFFFF">ALTO</text>
<rect x="550" y="335" width="505" height="275" rx="26" fill="#EAF4FF" stroke="#FFF1F2" stroke-width="2"/>
<circle cx="592" cy="377" r="25" fill="#1F75C9"/><text x="592" y="385" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#FFFFFF">2</text>
<g transform="translate(565,418)"><rect x="8" y="20" width="82" height="62" rx="24" fill="white" stroke="#123E69" stroke-width="5"/><rect x="22" y="34" width="54" height="30" rx="14" fill="#0F2947"/><circle cx="38" cy="49" r="5" fill="#23D5E8"/><circle cx="61" cy="49" r="5" fill="#23D5E8"/><line x1="49" y1="20" x2="49" y2="9" stroke="#123E69" stroke-width="5"/><circle cx="49" cy="6" r="5" fill="#123E69"/></g>
<text x="668" y="378" style="font-family:Arial,Helvetica,sans-serif;font-size:18.5px;font-weight:600;fill:#123E69"><tspan x="668" dy="0">Anthropic muestra ingresos</tspan><tspan x="668" dy="25">extraordinarios, pero también</tspan><tspan x="668" dy="25">pérdidas y compromisos de</tspan><tspan x="668" dy="25">infraestructura</tspan></text>
<text x="668" y="480" style="font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:400;fill:#24364B"><tspan x="668" dy="0">Anthropic informó ingresos trimestrales de</tspan><tspan x="668" dy="20">17.000 millones de dólares en una actualización</tspan><tspan x="668" dy="20">de su documentación para una posible oferta</tspan><tspan x="668" dy="20">pública inicial.</tspan></text>
<text x="668" y="570" style="font-family:Arial,Helvetica,sans-serif;font-size:11.2px;font-weight:600;fill:#52667A"><tspan x="668" dy="0">EMPLEO, PRODUCTIVIDAD Y</tspan><tspan x="668" dy="15">ECONOMÍA</tspan></text>
<rect x="935" y="557" width="100" height="34" rx="17" fill="#DC2626"/>
<text x="985" y="580" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#FFFFFF">ALTO</text>

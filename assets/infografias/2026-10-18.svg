<text x="143" y="958" style="font-family:Arial,Helvetica,sans-serif;font-size:18.5px;font-weight:600;fill:#075E47"><tspan x="143" dy="0">El FMI advierte que los riesgos de</tspan><tspan x="143" dy="25">la IA podrían superar sus</tspan><tspan x="143" dy="25">oportunidades sin salvaguardas</tspan></text>
<text x="143" y="1060" style="font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:400;fill:#24364B"><tspan x="143" dy="0">Durante las reuniones anuales del FMI y el Banco</tspan><tspan x="143" dy="20">Mundial, la directora gerente del FMI,</tspan><tspan x="143" dy="20">Kristalina Georgieva.</tspan></text>
<text x="143" y="1150" style="font-family:Arial,Helvetica,sans-serif;font-size:11.2px;font-weight:600;fill:#52667A"><tspan x="143" dy="0">EMPLEO, PRODUCTIVIDAD Y</tspan><tspan x="143" dy="15">ECONOMÍA</tspan></text>
<rect x="410" y="1137" width="100" height="34" rx="17" fill="#F59E0B"/>

<text x="66" y="1310" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#FFFFFF">1</text>
<text x="100" y="1304" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;font-weight:500;fill:#153A5B"><tspan x="100" dy="0">¿Qué controles deberían exigirse antes de que un agente de IA pueda</tspan><tspan x="100" dy="22">actuar en nombre de una persona?</tspan></text>
<circle cx="66" cy="1358" r="20" fill="#1F75C9"/>
<text x="66" y="1365" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#FFFFFF">2</text>
<text x="100" y="1359" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;font-weight:500;fill:#153A5B"><tspan x="100" dy="0">¿Cómo distinguir entre una advertencia científica responsable y una</tspan><tspan x="100" dy="22">predicción alarmista?</tspan></text>
<circle cx="66" cy="1413" r="20" fill="#1F75C9"/>
<text x="66" y="1420" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#FFFFFF">3</text>
<text x="100" y="1414" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;font-weight:500;fill:#153A5B"><tspan x="100" dy="0">¿Debe la protección de menores justificar límites especiales para los</tspan><tspan x="100" dy="22">chatbots?</tspan></text>
<rect x="25" y="1490" width="1030" height="265" rx="28" fill="#073C68"/>
<text x="55" y="1540" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">Semáforo de la semana</text>
<rect x="48" y="1570" width="300" height="155" rx="20" fill="#FFE4E7"/>
<circle cx="90" cy="1612" r="22" fill="#EF4444"/>
<text x="126" y="1608" font-family="Arial" font-size="17" font-weight="700" fill="#18324A">Riesgo:</text>
<text x="126" y="1633" style="font-family:Arial,Helvetica,sans-serif;font-size:13.5px;font-weight:500;fill:#273E54"><tspan x="126" dy="0">la expansión de sistemas</tspan><tspan x="126" dy="17">con acceso a herramientas,</tspan><tspan x="126" dy="17">dispositivos.</tspan></text>
<rect x="380" y="1570" width="300" height="155" rx="20" fill="#FFF2C4"/>
<circle cx="422" cy="1612" r="22" fill="#F2B705"/>
<text x="458" y="1608" font-family="Arial" font-size="17" font-weight="700" fill="#18324A">Atención:</text>
<text x="458" y="1633" style="font-family:Arial,Helvetica,sans-serif;font-size:13.5px;font-weight:500;fill:#273E54"><tspan x="458" dy="0">el impacto de la IA en la</tspan><tspan x="458" dy="17">formación científica, la</tspan><tspan x="458" dy="17">autoría y las trayectorias</tspan><tspan x="458" dy="17">profesionales.</tspan></text>
<rect x="712" y="1570" width="300" height="155" rx="20" fill="#DCF7EA"/>
<circle cx="754" cy="1612" r="22" fill="#10B981"/>
<text x="790" y="1608" font-family="Arial" font-size="17" font-weight="700" fill="#18324A">Oportunidad:</text>
<text x="790" y="1633" style="font-family:Arial,Helvetica,sans-serif;font-size:13.5px;font-weight:500;fill:#273E54"><tspan x="790" dy="0">más recursos para evaluar</tspan><tspan x="790" dy="17">agentes y utilizar IA</tspan><tspan x="790" dy="17">explicable en investigación</tspan><tspan x="790" dy="17">ambiental.</tspan></text>

<g transform="translate(40,708)"><path d="M50 5 L94 83 H6 Z" fill="#FFD54A" stroke="#5C4700" stroke-width="5"/><line x1="50" y1="29" x2="50" y2="58" stroke="#5C4700" stroke-width="7" stroke-linecap="round"/><circle cx="50" cy="70" r="4" fill="#5C4700"/></g>
<text x="143" y="668" style="font-family:Arial,Helvetica,sans-serif;font-size:18.5px;font-weight:600;fill:#5C4700"><tspan x="143" dy="0">Nvidia compromete 250 millones de</tspan><tspan x="143" dy="25">dólares en recursos informáticos</tspan><tspan x="143" dy="25">para seguridad de IA en Reino Unido</tspan></text>
<text x="143" y="770" style="font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:400;fill:#24364B"><tspan x="143" dy="0">Nvidia anunció el 14 de octubre que</tspan><tspan x="143" dy="20">proporcionará recursos de computación valorados</tspan><tspan x="143" dy="20">en 250 millones de dólares durante cinco años</tspan><tspan x="143" dy="20">para apoyar investigaciones británicas sobre</tspan></text>
<text x="143" y="860" style="font-family:Arial,Helvetica,sans-serif;font-size:11.2px;font-weight:600;fill:#52667A"><tspan x="143" dy="0">EVALUACIÓN, ESTÁNDARES Y</tspan><tspan x="143" dy="15">POLÍTICA TECNOLÓGICA</tspan></text>
<rect x="410" y="847" width="100" height="34" rx="17" fill="#F59E0B"/>
<text x="460" y="870" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#2D2200">MEDIO</text>

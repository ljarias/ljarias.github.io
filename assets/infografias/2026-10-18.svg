<text x="668" y="378" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:600;fill:#123E69"><tspan x="668" dy="0">Anthropic advierte sobre la</tspan><tspan x="668" dy="25">posible autorreplicación de</tspan><tspan x="668" dy="25">modelos pequeños</tspan></text>
<text x="668" y="480" style="font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:400;fill:#24364B"><tspan x="668" dy="0">Anthropic publicó una advertencia basada en</tspan><tspan x="668" dy="20">experimentos de seguridad: modelos relativamente</tspan><tspan x="668" dy="20">pequeños podrían acercarse, durante los próximos</tspan><tspan x="668" dy="20">meses.</tspan></text>
<text x="668" y="570" style="font-family:Arial,Helvetica,sans-serif;font-size:11.2px;font-weight:600;fill:#52667A"><tspan x="668" dy="0">SEGURIDAD, ALINEACIÓN Y</tspan><tspan x="668" dy="15">CIBERSEGURIDAD</tspan></text>
<rect x="935" y="557" width="100" height="34" rx="17" fill="#DC2626"/>
<text x="985" y="580" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#FFFFFF">ALTO</text>

<text x="668" y="958" style="font-family:Arial,Helvetica,sans-serif;font-size:18.5px;font-weight:600;fill:#731A37"><tspan x="668" dy="0">Nature examina el impacto de la IA</tspan><tspan x="668" dy="25">en las carreras de jóvenes</tspan><tspan x="668" dy="25">investigadores</tspan></text>
<text x="668" y="1060" style="font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:400;fill:#24364B"><tspan x="668" dy="0">Nature informó que los estudiantes de doctorado</tspan><tspan x="668" dy="20">estadounidenses que utilizaron inteligencia</tspan><tspan x="668" dy="20">artificial fueron más propensos a incorporarse a</tspan><tspan x="668" dy="20">la industria que a permanecer en la academia.</tspan></text>
<text x="668" y="1150" style="font-family:Arial,Helvetica,sans-serif;font-size:11.2px;font-weight:600;fill:#52667A"><tspan x="668" dy="0">EDUCACIÓN, EMPLEO Y</tspan><tspan x="668" dy="15">COMPETENCIAS DIGITALES</tspan></text>
<rect x="935" y="1137" width="100" height="34" rx="17" fill="#F59E0B"/>
<text x="985" y="1160" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#2D2200">MEDIO</text>

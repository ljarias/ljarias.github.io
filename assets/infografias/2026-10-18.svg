<circle cx="592" cy="667" r="25" fill="#6C51C7"/><text x="592" y="675" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#FFFFFF">4</text>
<g transform="translate(565,708)" fill="none" stroke="#392B73" stroke-width="5"><circle cx="50" cy="50" r="42"/><ellipse cx="50" cy="50" rx="18" ry="42"/><path d="M8 50 H92 M18 30 H82 M18 70 H82"/></g>
<text x="668" y="668" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:600;fill:#392B73"><tspan x="668" dy="0">Meta presenta los modelos Muse</tspan><tspan x="668" dy="25">Wonder para competir en</tspan><tspan x="668" dy="25">agentes de IA</tspan></text>
<text x="668" y="770" style="font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:400;fill:#24364B"><tspan x="668" dy="0">Meta presentó el 12 de octubre Muse Wonder y</tspan><tspan x="668" dy="20">Muse Wonder Full, modelos que la empresa</tspan><tspan x="668" dy="20">describe como sus sistemas más capaces hasta la</tspan><tspan x="668" dy="20">fecha.</tspan></text>
<text x="668" y="860" style="font-family:Arial,Helvetica,sans-serif;font-size:11.2px;font-weight:600;fill:#52667A"><tspan x="668" dy="0">AGENTES AUTÓNOMOS Y</tspan><tspan x="668" dy="15">COMPETENCIA TECNOLÓGICA</tspan></text>
<rect x="935" y="847" width="100" height="34" rx="17" fill="#F59E0B"/>
<text x="985" y="870" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#2D2200">MEDIO</text>
